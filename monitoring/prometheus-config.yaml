apiVersion: v1
kind: ConfigMap
metadata:
  name: food-ordering-prometheus-config
  namespace: food-ordering
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: food-ordering
        metrics_path: /metrics
        static_configs:
          - targets:
              - food-ordering-service.food-ordering.svc.cluster.local:80
