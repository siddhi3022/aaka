apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: food-ordering-ingress
  namespace: food-ordering
spec:
  ingressClassName: nginx
  rules:
    - host: food-ordering.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: food-ordering-service
                port:
                  number: 80
