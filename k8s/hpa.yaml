apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: food-ordering-hpa
  namespace: food-ordering
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: food-ordering
  minReplicas: 2
  maxReplicas: 5
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
